<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Character Design Brief Generator Ultimate</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --accent-dim: rgba(102, 252, 241, 0.15);
            --text-primary: #edf5e1;
            --text-secondary: #c5c6c7;
            --border-color: rgba(102, 252, 241, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        header .doc-id {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .brief-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .full-width {
            grid-column: span 2;
        }

        .field-box {
            background: rgba(11, 12, 16, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .field-box.roll {
            animation: pulse 0.25s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.99); opacity: 0.8; }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); opacity: 1; }
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .value {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-primary);
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: 700;
            border-radius: 10px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .generate-btn {
            flex: 2;
            background: var(--accent-color);
            color: #0b0c10;
            font-size: 1rem;
        }

        .generate-btn:hover {
            background: #45a29e;
            color: #fff;
        }

        .copy-btn {
            flex: 1;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .copy-btn:hover {
            background: var(--accent-dim);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .brief-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generate() {
            const keys = ['faction', 'role', 'lore', 'silhouette', 'outfit', 'weapon', 'note'];
            
            // Random Doc ID
            document.getElementById('doc-id').innerText = `REF-2026-${Math.floor(1000 + Math.random() * 9000)}`;

            keys.forEach(key => {
                const elem = document.getElementById(key);
                const parentBox = elem.parentElement;
                
                parentBox.classList.remove('roll');
                void parentBox.offsetWidth;
                parentBox.classList.add('roll');

                elem.innerText = getRandomElement(database[key]);
            });
        }

        function copyToClipboard() {
            const faction = document.getElementById('faction').innerText;
            if (faction === '-') return;

            const textToCopy = `[게임 캐릭터 디자인 기획서]\n` +
                `- 소속/세계관: ${faction}\n` +
                `- 역할/메카닉: ${document.getElementById('role').innerText}\n` +
                `- 캐릭터 서사: ${document.getElementById('lore').innerText}\n` +
                `- 실루엣 방침: ${document.getElementById('silhouette').innerText}\n` +
                `- 의상/재질: ${document.getElementById('outfit').innerText}\n` +
                `- 핵심 무기: ${document.getElementById('weapon').innerText}\n` +
                `- 기획 전달사항: ${document.getElementById('note').innerText}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        window.onload = generate;
